<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Nicholas Gil — perfil profissional</title>
<desc id="desc">Banner animado em estilo terminal apresentando Nicholas Gil e o ecossistema AVVA Connect.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111F"/>
    <stop offset="0.52" stop-color="#091424"/>
    <stop offset="1" stop-color="#07111F"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#24D6E8"><animate attributeName="stop-color" values="#24D6E8;#9A6BFF;#2FE6A1;#24D6E8" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="0.5" stop-color="#419BFF"><animate attributeName="stop-color" values="#419BFF;#2FE6A1;#9A6BFF;#419BFF" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#9A6BFF"><animate attributeName="stop-color" values="#9A6BFF;#24D6E8;#419BFF;#9A6BFF" dur="9s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#24D6E8" stop-opacity=".34"/>
    <stop offset="1" stop-color="#24D6E8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#16324C" stroke-width="1" opacity=".32"/>
  </pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
  </filter>
  <clipPath id="line1"><rect x="668" y="159" width="410" height="24"><animate attributeName="width" values="410;0;410;410" keyTimes="0;.05;.40;1" dur="5.5s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line2"><rect x="668" y="198" width="410" height="24"><animate attributeName="width" values="410;0;410;410" keyTimes="0;.05;.43;1" begin=".45s" dur="5.5s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line3"><rect x="668" y="237" width="410" height="24"><animate attributeName="width" values="410;0;410;410" keyTimes="0;.05;.46;1" begin=".9s" dur="5.5s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line4"><rect x="668" y="276" width="410" height="24"><animate attributeName="width" values="410;0;410;410" keyTimes="0;.05;.49;1" begin="1.35s" dur="5.5s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line5"><rect x="668" y="315" width="410" height="24"><animate attributeName="width" values="410;0;410;410" keyTimes="0;.05;.52;1" begin="1.8s" dur="5.5s" repeatCount="indefinite"/></rect></clipPath>
</defs>

<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<rect width="1200" height="520" rx="28" fill="url(#grid)"/>
<circle cx="1030" cy="90" r="210" fill="url(#orb)"><animate attributeName="r" values="175;235;175" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="230" cy="438" r="160" fill="url(#orb)" opacity=".52"><animate attributeName="cx" values="210;270;210" dur="10s" repeatCount="indefinite"/></circle>

<g>
  <rect x="42" y="42" width="1116" height="436" rx="20" fill="#0B1729" stroke="#1B4065" stroke-width="1.5"/>
  <rect x="42" y="42" width="1116" height="56" rx="20" fill="#091424"/>
  <path d="M42 98H1158" stroke="#1B4065"/>
  <circle cx="74" cy="70" r="7" fill="#FF647C"/>
  <circle cx="98" cy="70" r="7" fill="#FFC64B"/>
  <circle cx="122" cy="70" r="7" fill="#35D07F"/>
  <text x="600" y="76" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#7F9BB8">nicholas@avva: ~/profile --live</text>
  <circle cx="1114" cy="70" r="4.5" fill="#2FE6A1" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.25s" repeatCount="indefinite"/></circle>
  <text x="1127" y="75" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#2FE6A1">ONLINE</text>
</g>

<!-- Left identity module -->
<g>
  <rect x="76" y="126" width="520" height="310" rx="18" fill="#091424" stroke="#1B4065"/>
  <text x="102" y="156" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="3" fill="#7F9BB8">IDENTITY.CORE</text>
  <path d="M102 169H568" stroke="url(#accent)" stroke-width="2" opacity=".75"/>
  <g transform="translate(115 190)">
    <circle cx="118" cy="101" r="91" fill="none" stroke="#1B4065" stroke-dasharray="5 10"><animateTransform attributeName="transform" type="rotate" from="0 118 101" to="360 118 101" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="101" r="68" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="28 12" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="360 118 101" to="0 118 101" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="101" r="54" fill="url(#orb)"/>
    <text x="118" y="124" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="70" fill="url(#accent)" filter="url(#glow)">NG</text>
    <circle cx="118" cy="4" r="4" fill="#24D6E8"><animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="101" r="4" fill="#9A6BFF"><animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="198" r="4" fill="#2FE6A1"><animate attributeName="r" values="3;7;3" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="371" y="225" font-size="13" fill="#24D6E8">NAME</text>
    <text x="371" y="251" font-size="25" font-weight="700" fill="#EAF6FF">Nicholas Gil</text>
    <text x="371" y="286" font-size="13" fill="#24D6E8">ROLE</text>
    <text x="371" y="312" font-size="15" font-weight="700" fill="#EAF6FF">Full-Stack &amp; AI Architect</text>
    <text x="371" y="347" font-size="13" fill="#24D6E8">ECOSYSTEM</text>
    <text x="371" y="373" font-size="18" font-weight="700" fill="url(#accent)">AVVA CONNECT</text>
    <text x="371" y="406" font-size="12" fill="#7F9BB8">ERP • SaaS • Automação • IA</text>
  </g>
</g>

<!-- Right terminal info -->
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
  <text x="644" y="132" font-size="11" letter-spacing="3" fill="#7F9BB8">SYSTEM.INFO</text>
  <path d="M644 145H1120" stroke="#1B4065"/>
  <text x="644" y="176" font-size="13" fill="#24D6E8">Mission</text>
  <text x="668" y="176" font-size="13" fill="#EAF6FF" clip-path="url(#line1)">........ simplificar negócios com sistemas inteligentes</text>
  <text x="644" y="215" font-size="13" fill="#24D6E8">Product</text>
  <text x="668" y="215" font-size="13" fill="#EAF6FF" clip-path="url(#line2)">........ AVVA Connect — gestão empresarial</text>
  <text x="644" y="254" font-size="13" fill="#24D6E8">Core</text>
  <text x="668" y="254" font-size="13" fill="#EAF6FF" clip-path="url(#line3)">........ arquitetura • IA • produto • automação</text>
  <text x="644" y="293" font-size="13" fill="#24D6E8">Stack</text>
  <text x="668" y="293" font-size="13" fill="#EAF6FF" clip-path="url(#line4)">........ TypeScript • React • Node • Python • Docker</text>
  <text x="644" y="332" font-size="13" fill="#24D6E8">Status</text>
  <text x="668" y="332" font-size="13" fill="#EAF6FF" clip-path="url(#line5)">........ shipping products &amp; improving systems</text>

  <rect x="644" y="364" width="476" height="55" rx="11" fill="none" stroke="#1B4065"/>
  <text x="663" y="387" font-size="11" fill="#7F9BB8">CURRENT.FOCUS</text>
  <text x="663" y="407" font-size="13" fill="#2FE6A1">SaaS + sistemas cognitivos + IA aplicada</text>
  <rect x="1086" y="382" width="18" height="18" rx="3" fill="#2FE6A1" opacity=".16"/>
  <rect x="1091" y="387" width="8" height="8" rx="1" fill="#2FE6A1"><animate attributeName="opacity" values="1;.25;1" dur="1s" repeatCount="indefinite"/></rect>
</g>

<!-- Floating telemetry dots -->
<g fill="#24D6E8" opacity=".9">
  <circle cx="629" cy="118" r="2"><animate attributeName="cy" values="118;426;118" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="1137" cy="436" r="2"><animate attributeName="cy" values="436;118;436" dur="10s" repeatCount="indefinite"/></circle>
</g>
<rect x="54" y="110" width="2" height="330" fill="url(#accent)" opacity=".65"><animate attributeName="y" values="110;430;110" attributeName2="height" dur="7s" repeatCount="indefinite"/></rect>
</svg>
