  <rect width="230" height="88" rx="16" fill="#FFFFFF" stroke="#BEDAF3"/><circle cx="28" cy="28" r="9" fill="#24D6E8"/><text x="48" y="32" font-size="15" font-weight="700" fill="#0C2135">ERP &amp; Gestão</text><text x="22" y="61" font-size="11" fill="#526F8D">financeiro • cadastros • operação</text>
 </g>
 <g transform="translate(880 94)"><animateTransform attributeName="transform" type="translate" values="880 94;880 105;880 94" dur="4.6s" repeatCount="indefinite"/>
  <rect width="230" height="88" rx="16" fill="#FFFFFF" stroke="#BEDAF3"/><circle cx="28" cy="28" r="9" fill="#9A6BFF"/><text x="48" y="32" font-size="15" font-weight="700" fill="#0C2135">IA Aplicada</text><text x="22" y="61" font-size="11" fill="#526F8D">agentes • modelos • decisões</text>
 </g>
 <g transform="translate(78 310)"><animateTransform attributeName="transform" type="translate" values="78 310;88 310;78 310" dur="5s" repeatCount="indefinite"/>
  <rect width="240" height="88" rx="16" fill="#FFFFFF" stroke="#BEDAF3"/><circle cx="28" cy="28" r="9" fill="#2FE6A1"/><text x="48" y="32" font-size="15" font-weight="700" fill="#0C2135">Automação</text><text x="22" y="61" font-size="11" fill="#526F8D">workflows • integrações • escala</text>
 </g>
 <g transform="translate(882 304)"><animateTransform attributeName="transform" type="translate" values="882 304;872 304;882 304" dur="5.4s" repeatCount="indefinite"/>
  <rect width="240" height="88" rx="16" fill="#FFFFFF" stroke="#BEDAF3"/><circle cx="28" cy="28" r="9" fill="#419BFF"/><text x="48" y="32" font-size="15" font-weight="700" fill="#0C2135">Infraestrutura</text><text x="22" y="61" font-size="11" fill="#526F8D">VPS • Docker • observabilidade</text>
 </g>
 <g transform="translate(480 82)"><animateTransform attributeName="transform" type="translate" values="480 82;480 72;480 82" dur="3.8s" repeatCount="indefinite"/>
  <rect width="240" height="74" rx="16" fill="#FFFFFF" stroke="#BEDAF3"/><circle cx="28" cy="25" r="8" fill="#FF5FA2"/><text x="47" y="29" font-size="14" font-weight="700" fill="#0C2135">Produto &amp; UX</text><text x="22" y="52" font-size="10.5" fill="#526F8D">clareza • fluxo • experiência</text>
 </g>
</g>

<!-- Connections -->
<g fill="none" stroke="url(#ecoAccent)" stroke-width="2" stroke-dasharray="5 8" opacity=".48">
 <path d="M320 148C410 160 440 190 478 217"><animate attributeName="stroke-dashoffset" values="26;0" dur="2s" repeatCount="indefinite"/></path>
 <path d="M880 138C790 150 758 186 722 217"><animate attributeName="stroke-dashoffset" values="26;0" dur="2.3s" repeatCount="indefinite"/></path>
