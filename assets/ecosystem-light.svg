<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="Ecossistema AVVA Connect">
<defs>
 <linearGradient id="ecoBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
 <linearGradient id="ecoAccent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#24D6E8"/><stop offset=".5" stop-color="#9A6BFF"/><stop offset="1" stop-color="#2FE6A1"/></linearGradient>
 <filter id="ecoGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="ecoShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#6B9CC6" flood-opacity=".22"/></filter>
</defs>
<rect width="1200" height="450" rx="24" fill="url(#ecoBg)"/>
<text x="54" y="48" font-family="ui-monospace,Consolas,monospace" font-size="12" letter-spacing="3" fill="#526F8D">AVVA.ECOSYSTEM / LIVE ARCHITECTURE</text>
<path d="M54 63H1146" stroke="#BEDAF3"/>

<g transform="translate(600 244)">
 <ellipse rx="390" ry="142" fill="none" stroke="#BEDAF3" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="280" ry="100" fill="none" stroke="url(#ecoAccent)" stroke-dasharray="42 18" opacity=".55"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/></ellipse>
 <circle r="100" fill="none" stroke="#24D6E8" opacity=".18"><animate attributeName="r" values="88;118;88" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".28;.02;.28" dur="4s" repeatCount="indefinite"/></circle>
 <g>
  <rect x="-128" y="-65" width="256" height="130" rx="24" fill="#FFFFFF" stroke="url(#ecoAccent)" stroke-width="2"/>
  <text y="-16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="26" fill="url(#ecoAccent)">AVVA CONNECT</text>
  <text y="15" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#526F8D">BUSINESS OPERATING SYSTEM</text>
  <circle cx="-60" cy="42" r="4" fill="#2FE6A1" filter="url(#ecoGlow)"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="-48" y="47" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#2FE6A1">ONLINE / EVOLVING</text>
 </g>
</g>

<!-- Node cards -->
<g font-family="ui-monospace,Consolas,monospace">
